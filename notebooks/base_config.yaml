mgrids:
  _target_: fieldspacenn.src.modules.grids.grid_utils.healpix_grid_to_mgrid
  zoom_max: 9
dataloader:
  dataset:
    _target_: fieldspacenn.src.data.datasets_healpix.HealPixLoader
    norm_dict: null
    p_dropout: 0
    random_p: false
    p_dropout_all: 0
    n_sample_variables: -1
    output_binary_mask: true
    apply_diff: true
    mask_ts_mode: zero
    sampling_zooms:
      5:
        n_past_ts: 0
        n_future_ts: 0
        zoom_patch_sample: -1
      7:
        n_past_ts: 0
        n_future_ts: 0
        zoom_patch_sample: -1
      9:
        n_past_ts: 0
        n_future_ts: 0
        zoom_patch_sample: -1
    output_max_zoom_only: false
  datamodule:
    _target_: fieldspacenn.src.data.pl_data_module.DataModule
    batch_size: 1
    num_workers: 4
    use_costum_ddp_sampler: false
data_variables:
  # The training notebook replaces this mapping from VARIABLES. Keep 2D fields
  # at one selected level. An optional 3D group may retain all levels or an
  # equal-length level_indices subset for every variable in that group.
  2D:
    tas: {}
embedding:
  MGEmbedder:
    shared: false
    in_channels: 2
    embed_dim: 64
    n_variables: 1
    init_method: spherical_harmonics
ckpt_path: null
ckpt_path_pretrained: null
project_name: mg_hyperprior_autoencoder_hpx9_cycle4
run_name: tas
run_dir: ./
