        separate_mlp_norm: true
        q_zooms:
        - 5
        - 7
        - 9
        kv_zooms:
        - 5
        - 7
        - 9
        target_zooms:
        - 7
        - 9
        token_zoom: 2
        att_dim: 256
        token_len_depth:
        - 1
        token_len_time: 1
        token_overlap_space: true
        token_overlap_time: false
        token_overlap_depth: false
        token_overlap_mlp_time: false
        token_overlap_mlp_depth: false
        rank_depth:
        - null
        seq_len_zoom: -1
        seq_len_time: -1
        seq_len_depth: -1
        with_var_att: false
        update: shift_scale
        embed_confs:
          embed_names:
          - MGEmbedder
          input_zoom: 2
          embed_confs:
            ${embedding}
          embed_mode: sum
    hyper_analysis_block_configs:
      hyper_att_0:
        _target_: fieldspacenn.src.modules.field_space.field_space_attention.FieldSpaceAttentionConfig
        separate_mlp_norm: true
        q_zooms:
        - 7
        kv_zooms:
        - 7
        token_zoom: 4
        att_dim: 256
        token_len_depth:
        - 1
        token_len_time: 1
        token_overlap_space: true
        token_overlap_time: false
        token_overlap_depth: false
        token_overlap_mlp_time: false
        token_overlap_mlp_depth: false
        rank_depth:
        - null
        seq_len_zoom: -1
        seq_len_time: -1
        seq_len_depth: -1
        with_var_att: false
        update: shift_scale
        embed_confs:
          embed_names:
          - MGEmbedder
          input_zoom: 4
          embed_confs:
            ${embedding}
          embed_mode: sum
      hyper_att_1:
        _target_: fieldspacenn.src.modules.field_space.field_space_attention.FieldSpaceAttentionConfig
        separate_mlp_norm: true
        q_zooms:
        - 7
        kv_zooms:
        - 7
        token_zoom: 4
        att_dim: 256
        token_len_depth:
        - 1
        token_len_time: 1
        token_overlap_space: true
        token_overlap_time: false
        token_overlap_depth: false
        token_overlap_mlp_time: false
        token_overlap_mlp_depth: false
        rank_depth:
        - null
        seq_len_zoom: -1
        seq_len_time: -1
        seq_len_depth: -1
        with_var_att: false
        update: shift_scale
        embed_confs:
          embed_names:
          - MGEmbedder
          input_zoom: 4
          embed_confs:
            ${embedding}
          embed_mode: sum
    hyper_synthesis_block_configs:
      hyper_att_0:
        _target_: fieldspacenn.src.modules.field_space.field_space_attention.FieldSpaceAttentionConfig
        separate_mlp_norm: true
        q_zooms:
        - 7
        kv_zooms:
        - 7
        token_zoom: 4
        att_dim: 256
        token_len_depth:
        - 1
        token_len_time: 1
        token_overlap_space: true
        token_overlap_time: false
        token_overlap_depth: false
        token_overlap_mlp_time: false
        token_overlap_mlp_depth: false
        rank_depth:
        - null
        seq_len_zoom: -1
        seq_len_time: -1
        seq_len_depth: -1
        with_var_att: false
        update: shift_scale
        embed_confs:
          embed_names:
          - MGEmbedder
          input_zoom: 4
          embed_confs:
            ${embedding}
          embed_mode: sum
      hyper_att_1:
        _target_: fieldspacenn.src.modules.field_space.field_space_attention.FieldSpaceAttentionConfig
        separate_mlp_norm: true
        q_zooms:
        - 7
        kv_zooms:
        - 7
        token_zoom: 4
